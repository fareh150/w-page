<div class="flex items-center justify-center min-h-screen bg-black text-white">
  <div class="overflow-x-auto">
    <table class="text-center min-w-full">
      <thead>
        <tr>
          <th class="px-2 text-sm sm:px-4 sm:text-lg md:text-xl lg:text-2xl">Years</th>
          <th class="px-2 text-sm sm:px-4 sm:text-lg md:text-xl lg:text-2xl">Months</th>
          <th class="px-2 text-sm sm:px-4 sm:text-lg md:text-xl lg:text-2xl">Days</th>
          <th class="px-2 text-sm sm:px-4 sm:text-lg md:text-xl lg:text-2xl">Hours</th>
          <th class="px-2 text-sm sm:px-4 sm:text-lg md:text-xl lg:text-2xl">Minutes</th>
          <th class="px-2 text-sm sm:px-4 sm:text-lg md:text-xl lg:text-2xl">Seconds</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="px-2 text-2xl sm:px-4 sm:text-4xl md:text-5xl lg:text-6xl">{{ timeLeft.years }}</td>
          <td class="px-2 text-2xl sm:px-4 sm:text-4xl md:text-5xl lg:text-6xl">{{ timeLeft.months }}</td>
          <td class="px-2 text-2xl sm:px-4 sm:text-4xl md:text-5xl lg:text-6xl">{{ timeLeft.days }}</td>
          <td class="px-2 text-2xl sm:px-4 sm:text-4xl md:text-5xl lg:text-6xl">{{ timeLeft.hours }}</td>
          <td class="px-2 text-2xl sm:px-4 sm:text-4xl md:text-5xl lg:text-6xl">{{ timeLeft.minutes }}</td>
          <td class="px-2 text-2xl sm:px-4 sm:text-4xl md:text-5xl lg:text-6xl">{{ timeLeft.seconds }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
