<div class="flex flex-col md:flex-row items-center space-x-0 md:space-x-6"
     [class]="{'md:flex-row-reverse': imageRight}">

  <!-- Imagen -->
  <div class="w-full md:w-1/2 flex justify-center">
    <img [src]="imageUrl" alt="Imagen" class="max-w-full h-auto rounded-lg shadow-md">
  </div>

  <!-- Texto -->
  <div class="w-full md:w-1/2 text-center md:text-left pt-1">
    <h2 class="text-2xl font-bold mb-4">{{ title }}</h2>
    <p class="text-gray-700">{{ text }}</p>
    <ng-content></ng-content>
  </div>
</div>
